name = "cloud-ledger-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "cloud-ledger-db"
database_id = "9c4e98b5-8bd5-4ded-8c11-0c1267e435e1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "cloud-ledger-receipts"

[triggers]
crons = ["*/15 * * * *"]