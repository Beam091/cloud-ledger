name = "cloud-ledger"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
APP_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "cloud-ledger-db"
database_id = "51667351-c3ab-4e89-8914-9175f52e5008"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "cloud-ledger-receipts"

[triggers]
crons = ["*/15 * * * *"]